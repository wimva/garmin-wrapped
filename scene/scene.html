<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Garmin Wrapped '26 — Prism background scene</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-width:100vw;max-height:100vh;width:auto!important;height:auto!important;margin:0 auto}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<script type="module">
// Garmin Wrapped '26 background scene.
// One long 3D strip (10 slides x 1080 px). An orthographic camera renders one slide window at a time,
// so shapes that cross a seam continue exactly into the next slide (Garmin School panorama rule).
// The triangle is the motif (a nod to the Garmin delta, never the logo itself): rounded prisms,
// triangle rings, tetrahedra and triangle confetti. GSAP drives every motion on one 6 s seamless loop.
import * as THREE from 'three';

const tokens = await (await fetch('../kit/style/tokens.json')).json();
const W = 1080, H = 1350, N = tokens.slides.length, STRIP = W * N, LOOP = 6;
const pal = tokens.slides;

const params = new URLSearchParams(location.search);
const PR = parseFloat(params.get('pr') || '1');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(PR);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(0, STRIP, 0, -H, -3000, 3000);
cam.position.set(0, 0, 1500);

// ---------- background: per-slide colour fields that blend across each seam + grain ----------
const bgColors = pal.map(p => new THREE.Color(p.bg));
const bgMat = new THREE.ShaderMaterial({
  uniforms: { cols: { value: bgColors }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `
    uniform vec3 cols[${N}]; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      float x = vUv.x * ${N}.0;            // slide coordinate
      float i = floor(x); float f = x - i;
      int a = int(clamp(i, 0.0, ${N - 1}.0));
      int b = int(clamp(i + 1.0, 0.0, ${N - 1}.0));
      int c = int(clamp(i - 1.0, 0.0, ${N - 1}.0));
      vec3 col = cols[a];
      // blend 22% of a slide on each side of a seam, so colours flow from slide to slide
      if (f > 0.78) col = mix(cols[a], cols[b], smoothstep(0.78, 1.22, f) );
      if (f < 0.22) col = mix(cols[c], cols[a], smoothstep(-0.22, 0.22, f) );
      // soft vertical light falloff + fine grain (the analog texture of Wrapped '25)
      col *= 0.93 + 0.12 * (1.0 - vUv.y);
      col += (h(gl_FragCoord.xy + floor(uTime*0.0)) - 0.5) * 0.035;
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  depthWrite: false
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(STRIP, H), bgMat);
bg.position.set(STRIP / 2, -H / 2, -1200);
scene.add(bg);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(STRIP, H), new THREE.ShadowMaterial({ opacity: 0.2 }));
shadowCatcher.position.set(STRIP / 2, -H / 2, -260);
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a4a7a, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(STRIP / 2 - 420, -H / 2 + 560, 1600);
key.target.position.set(STRIP / 2, -H / 2, -260);
key.castShadow = true;
key.shadow.mapSize.set(8192, 2048);
Object.assign(key.shadow.camera, { left: -STRIP / 2 - 800, right: STRIP / 2 + 800, top: H, bottom: -H, near: 10, far: 6000 });
key.shadow.radius = 10;
key.shadow.bias = -0.0005;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffffff, 1.1);
rim.position.set(STRIP / 2 + 900, -400, 600);
scene.add(rim);

// ---------- triangle geometry ----------
function roundedTriangle(r = 1, round = 0.18, hole = 0) {
  const pts = [0, 1, 2].map(k => new THREE.Vector2(Math.cos(Math.PI / 2 + k * 2 * Math.PI / 3) * r, Math.sin(Math.PI / 2 + k * 2 * Math.PI / 3) * r));
  const path = (P, rr) => {
    const s = new THREE.Shape();
    for (let k = 0; k < 3; k++) {
      const p = P[k], prev = P[(k + 2) % 3], next = P[(k + 1) % 3];
      const a = p.clone().lerp(prev, rr), b = p.clone().lerp(next, rr);
      if (k === 0) s.moveTo(a.x, a.y); else s.lineTo(a.x, a.y);
      s.quadraticCurveTo(p.x, p.y, b.x, b.y);
    }
    s.closePath();
    return s;
  };
  const shape = path(pts, round);
  if (hole > 0) {
    const inner = pts.map(p => p.clone().multiplyScalar(hole));
    const hp = path(inner, round);
    shape.holes.push(new THREE.Path(hp.getPoints(24).reverse()));
  }
  return shape;
}
function prismGeo(depth = 0.55, hole = 0) {
  const g = new THREE.ExtrudeGeometry(roundedTriangle(1, 0.2, hole), {
    depth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.07, bevelSegments: 6, curveSegments: 24
  });
  g.center();
  return g;
}
const GEO = {
  prism: prismGeo(0.55),
  slab: prismGeo(0.22),
  ring: prismGeo(0.3, 0.62),
  tetra: new THREE.TetrahedronGeometry(1, 0),
  flat: new THREE.ShapeGeometry(roundedTriangle(1, 0.12))
};
const mat = (c, flat = false) => flat
  ? new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })
  : new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.38, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.18, sheen: 0.3 });

// ---------- composition (strip px, y down) ----------
// Big shapes sit ON the seams so every swipe continues the previous slide. Content zone (x 80–1000, y 170–1180)
// stays mostly clear; Python draws the data layer on top.
const S = (i) => i * W; // left edge of slide i (0-based)
const shapes = [
  // slide 1 hero (the title sits on top of it)
  { t: 'prism', x: 860, y: 620, s: 430, c: pal[0].shape, rx: 0.5, ry: -0.6, rz: 0.25, z: 0 },
  // seam shapes live in the bottom band (y > 1150) so they never cover text, and always cross the seam
  ...[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => ({
    t: ['prism', 'tetra', 'ring', 'slab', 'prism', 'ring', 'tetra', 'slab', 'ring'][k - 1],
    x: S(k), y: k % 2 ? 1300 : 1275, s: [200, 175, 205, 185, 210, 180, 190, 200, 215][k - 1],
    c: pal[k - 1].shape, rx: 0.4 + 0.1 * k, ry: 0.3 - 0.07 * k, rz: 0.5 * k, z: 0
  })),
  // CTA slide accents, kept clear of avatar, title and handles
  { t: 'prism', x: S(9) + 1010, y: 330, s: 120, c: pal[9].shape2, rx: 0.5, ry: 0.5, rz: 0.4, z: 0 },
  { t: 'tetra', x: S(9) + 70, y: 430, s: 95, c: '#FFD23F', rx: 0.3, ry: 0.2, rz: 0.1, z: 0 },
  { t: 'slab', x: S(9) + 1030, y: 880, s: 80, c: '#1FB6FF', rx: 0.3, ry: 0.6, rz: 2.2, z: 0 }
];

const loop = gsap.timeline({ paused: true });
// giant flat tone-on-tone triangles: the bold graphic layer behind everything (some cross a seam)
const giants = [
  [0, 300, 260, 820, 0.35], [1, 820, 1060, 900, 2.6], [2, 160, 1140, 780, 1.1], [3, 900, 230, 860, 3.5],
  [4, 140, 300, 820, 4.4], [5, 880, 1120, 900, 0.5], [6, 220, 180, 800, 2.0], [7, 900, 1050, 880, 5.2],
  [8, 120, 1080, 860, 3.0], [9, 540, 560, 760, 0.0]
];
giants.forEach(([i, x, y, s, r]) => {
  const p = pal[i];
  const c = new THREE.Color(p.bg).lerp(new THREE.Color(i === 9 ? '#3a2a6e' : p.shape2), i === 9 ? 0.9 : 0.16);
  const m = new THREE.Mesh(GEO.flat, mat(c, true));
  m.scale.setScalar(s); m.position.set(i * W + x, -y, -700); m.rotation.z = r;
  scene.add(m);
  loop.to(m.rotation, { z: r + 0.12, duration: LOOP / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
});
const meshes = [];
shapes.forEach((d, idx) => {
  const m = new THREE.Mesh(GEO[d.t], mat(d.c));
  m.castShadow = true;
  m.position.set(d.x, -d.y, d.z);
  m.scale.setScalar(d.s);
  m.rotation.set(d.rx, d.ry, d.rz);
  scene.add(m);
  meshes.push(m);
  // seamless 6 s motion: half-loop yoyo tweens (3 s out, 3 s back)
  const amp = d.s > 200 ? 0.35 : 0.8;
  loop.to(m.rotation, { x: d.rx + amp * (idx % 2 ? 1 : -1), y: d.ry + amp * 1.2, duration: LOOP / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  loop.to(m.position, { y: -d.y + (d.s > 200 ? 14 : 26) * (idx % 2 ? 1 : -1), duration: LOOP / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
});

// confetti: flat triangles that orbit tiny circles (seamless) and spin a full turn per loop
const rng = (() => { let s = 26; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const confColors = pal.flatMap(p => [p.shape, p.shape2]);
for (let k = 0; k < 520; k++) {
  const x = rng() * STRIP, y = rng() * H;
  const slideX = x % W;
  // keep the content column calm: fewer, smaller pieces in the middle of each slide
  // keep the content column clear: confetti only in the outer frame of every slide
  const inCenter = slideX > 45 && slideX < 1035 && y > 135 && y < 1150;
  if (inCenter) continue;
  const s = 10 + rng() * 18;
  const slide = Math.min(N - 1, Math.floor(x / W));
  const c = rng() < 0.5 ? pal[slide].shape : (rng() < 0.5 ? pal[slide].shape2 : '#FFFFFF');
  const m = new THREE.Mesh(GEO.flat, mat(c, true));
  m.scale.setScalar(s);
  m.position.set(x, -y, 500);
  scene.add(m);
  const r = 8 + rng() * 18, ph = rng() * Math.PI * 2, rot0 = rng() * Math.PI * 2, dir = rng() < 0.5 ? -1 : 1;
  const o = { a: 0 };
  loop.to(o, {
    a: 1, duration: LOOP, ease: 'none', onUpdate: () => {
      const ang = ph + o.a * Math.PI * 2;
      m.position.x = x + Math.cos(ang) * r;
      m.position.y = -y + Math.sin(ang) * r;
      m.rotation.z = rot0 + dir * o.a * Math.PI * 2;
    }
  }, 0);
}

window.drawSlide = (i, t) => {
  loop.time(((t % LOOP) + LOOP) % LOOP, false);
  cam.setViewOffset(STRIP, H, i * W, 0, W, H);
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
  return true;
};
window.frameData = () => renderer.domElement.toDataURL('image/png');
window.ready = true;
// viewer: ?slide=1..10 plays that slide window of the strip in real time (the 6 s loop)
if (params.has('slide')) {
  const i = Math.max(1, Math.min(N, parseInt(params.get('slide'), 10) || 1)) - 1;
  const t0 = performance.now();
  const tick = () => { window.drawSlide(i, (performance.now() - t0) / 1000); requestAnimationFrame(tick); };
  tick();
}
</script>
</body>
</html>
